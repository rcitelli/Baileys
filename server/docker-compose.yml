services:
  baileys-server:
    build:
      # Build context is the repository root so the parent Baileys library can be built too.
      context: ..
      dockerfile: server/Dockerfile
    image: baileys-server:latest
    container_name: baileys-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Bind to localhost only — Cloudflare Tunnel / your reverse proxy fronts this.
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - ./data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
